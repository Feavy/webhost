server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    # A symlink that is renamed over atomically on every deploy. nginx resolves
    # it per request, so a new release is live without a reload.
    root  /var/www/current;
    index index.html index.htm;

    server_tokens off;
    charset utf-8;

    # Liveness probe used by the image HEALTHCHECK and by orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static assets get a short cache: long enough to help, short enough that a
    # new deploy is visible quickly (there is no content-hash assumption here).
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot|map)$ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    location / {
        # What happens when a path matches no file is environment-dependent
        # (SPA), so it lives in a snippet rewritten at startup by the entrypoint:
        # either `try_files $uri $uri/ =404;` or the fallback to /index.html.
        include /etc/nginx/webhost/routing.conf;
    }

    # Never let a stale index.html hide a fresh deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
